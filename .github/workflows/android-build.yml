name: Build Android APK
on:
push:
branches: [ "main" ]
workflow_dispatch:
jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout code
uses: actions/checkout@v4
- name: Setup Node.js 20
uses: actions/setup-node@v4
with:
node-version: '20'
cache: 'npm'
- name: Setup JDK 17
uses: actions/setup-java@v4
with:
distribution: 'temurin'
java-version: '17'
- name: Verify Firebase secrets exist
run: |
if [ -z "${{ secrets.VITE_FIREBASE_API_KEY }}" ]; then
echo "Error: VITE_FIREBASE_API_KEY secret is missing!"
exit 1
fi
echo "Firebase secrets verified successfully."
- name: Install dependencies
run: npm install
- name: Build React app (Vite)
env:
VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
run: npm run build
- name: Add Android platform if missing
run: |
npx cap add android || true
- name: Sync Capacitor
run: npx cap sync android
- name: Ensure biometric permissions in AndroidManifest
run: |
MANIFEST="android/app/src/main/AndroidManifest.xml"
if [ -f "$MANIFEST" ]; then
if ! grep -q "USE_BIOMETRIC" "$MANIFEST"; then
sed -i '/<uses-permission.android.name="android.permission.INTERNET"./?>/a \    <uses-permission android:name="android.permission.USE_BIOMETRIC" />' "$MANIFEST"
fi
fi
- name: Build debug APK
run: |
cd android
chmod +x gradlew
./gradlew assembleDebug
- name: Upload APK artifact
uses: actions/upload-artifact@v4
with:
name: diabetes-care-debug-apk
path: android/app/build/outputs/apk/debug/app-debug.apk
